    /* ===== 减弱动效偏好 =====
       系统里开了「减少动态效果」就全部停掉（装饰性动画不该是访问门槛）。 */
    @media (prefers-reduced-motion: reduce) {
      .cm-loading-ball,
      .cm-loading-ball::after,
      .cm-loading-text,
      .cover::after,
      .cover .cover-main > *,
      .cm-scroll-hint,
      .cm-scroll-hint .cm-hint-arrow,
      .sidebar-nav li > ul > li,
      .cm-card-icon--sprite {
        animation: none !important;
      }
      /* 停掉逐帧后要把它钉在第一帧，否则会露在雪碧图的中间某一帧上 */
      .cm-card-icon--sprite { background-position: 0 0; }
      body.cm-reveal-ready .cm-reveal {
        opacity: 1;
        translate: none;
        transition: none;
      }
      .markdown-section > h1,
      .markdown-section > h2 {
        animation: none;
      }
    }
  </style>

  <!-- 视口高度锁定：见样式表末尾「视口高度」那段说明。
       ⚠ 必须放在 head 里、在首次渲染前执行，否则会先按 100vh 排一帧再跳一下。
       ⚠ 只监听 orientationchange，**不要监听 resize** ——
         听 resize 就等于又变回动态值，正是这次要修的病。 -->
  <script>
    (function () {
      function lockViewportHeight() {
        document.documentElement.style.setProperty('--cm-vh', window.innerHeight + 'px');
      }
      lockViewportHeight();
      // 旋转屏幕后重算：orientationchange 触发时尺寸往往还没更新，延后一拍再读
      window.addEventListener('orientationchange', function () {
        setTimeout(lockViewportHeight, 200);
      });
    })();
  </script>

  <!-- 语言自动跳转：浏览器语言不是中文的访客，直接进英文站。
       ⚠⚠ 必须放在 head 里、docsify 加载之前 —— 这段跑在「精灵球加载动画」那几百毫秒内，
           docsify 启动时直接按 #/en/ 渲染，**用户全程看不到中文内容**（不会闪一下再变）。
           放到页面底部的脚本里就会先渲染中文再跳，那才是肉眼可见的闪烁。
       ⚠ 用 history.replaceState 而不是 location.hash：前者不触发刷新、也**不往历史里塞记录**
          （否则国外访客按一次后退会退回中文站）。docsify 启动时直接读当前 hash，不受影响。
       ⚠ 只在「根路径首页」跳：直接分享出去的 .../#/en/features 这类内页链接不受影响。
       ⚠ 三道闸门缺一不可：手动选过语言 → 不跳；浏览器语言以 zh 开头 → 不跳；不是首页 → 不跳。 -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('cm-lang')) return;
        if (/^zh/i.test(navigator.language || '')) return;
        var h = location.hash;
        if (h === '' || h === '#' || h === '#/') {
          history.replaceState(null, '', location.pathname + location.search + '#/en/');
        }
      } catch (e) { /* 隐私模式下 localStorage 不可用等，静默跳过，保持中文站 */ }
    })();
  </script>
</head>
<body>
  <!-- 加载态：docsify 初始化时会把 #app 的内容整体换成页面骨架，所以这段会自然消失。
       作用是填上 CDN 取 docsify 那几百毫秒的空白，顺手亮个相。 -->
  <div id="app">
    <div class="cm-loading">
      <div class="cm-loading-ball"></div>
      <div class="cm-loading-text">正在进入市场…</div>
    </div>
  </div>

  <script>
    // ⚠ 以下 IIFE 与 $docsify 配置同处一个 <script> 块：任何一处抛出未捕获异常，
    //    都会中断整块执行（含 window.$docsify 的赋值 → 侧边栏/封面/搜索全没）。
    //    所以对可能缺失的浏览器 API 要单独做保护（见 isDarkNow 里的 matchMedia）。

    // ===== 加载层搬运（必须最先执行）=====
    // #app 里那段加载动画，docsify 初始化时会把 #app 的内容整体替换成页面骨架 ——
    // 留在里面就会瞬间消失，快网下根本来不及看清（这正是它以前等于不存在的原因）。
    // 先把它挪到 body 上：docsify 换的是 #app，动不到它，
    // 什么时候退场就由我们说了算（见 __cmAfterRender 里的 syncLoading）。
    (function () {
      var el = document.querySelector('#app .cm-loading');
      if (!el) return;
      el.id = 'cmLoading';          // 样式表里按 id 接管（见 #cmLoading 的退场规则）
      document.body.appendChild(el);
    })();

    // ===== 主题（暗黑模式）：跟随系统偏好，手动切换后记住选择 =====
    (function () {
      // 升到 v2：主题默认值从「跟随系统」改成「深色」，换 key 让浏览器里存的旧选择失效，
      // 否则老访客会一直被旧记忆按在浅色模式上、看不到新配色。
      var KEY = 'cobblemarket-theme-v2';

      function isDarkNow() {
        try {
          var saved = localStorage.getItem(KEY);
          if (saved) return saved === 'dark';   // 手动切过 → 尊重手动选择
        } catch (e) { /* 隐私模式下 localStorage 不可用，忽略 */ }
        // 没手动切过 → 跟随系统。手机（尤其 iPhone）会在夜间自动切深色，
        // 网页跟着变才不刺眼。
        // （早期版本固定返回深色、不跟随系统，理由是怕浅色系统上看到与模组风格
        //   不符的浅色站 —— 但浅色模式后来已经打磨过，那个顾虑不成立了。）
        try {
          return window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {
          return true;   // 拿不到 matchMedia 时兜底用深色
        }
      }

      function apply(dark) {
        // html 上要挂：暗色 CSS 变量声明在 html.dark 上（见样式表里「暗黑模式适配」注释），
        // 而 html 自身的 background 用的就是这个变量——挂 body 上 html 读不到，滚动露出的画布会留白
        document.documentElement.classList.toggle('dark', dark);
        document.body.classList.toggle('dark', dark);
      }

      // 手机浏览器的地址栏/状态栏配色跟着主题走（浅色模式下留深色会显得很割裂）
      function syncThemeColor(dark) {
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#101018' : '#ffffff');
      }

      /**
       * 应用主题，并让全站平滑过渡一次。
       * 手动切换、跟随系统变化都走这里 —— 否则系统那边一变，整站会"啪"地一下硬切。
       * 过渡只在切换的那一瞬挂（而不是常驻），否则 hover 之类的交互也会被拖慢。
       */
      function applyWithTransition(dark) {
        var root = document.documentElement;
        root.classList.add('cm-theming');
        clearTimeout(window.__cmThemeTimer);
        window.__cmThemeTimer = setTimeout(function () {
          root.classList.remove('cm-theming');
        }, 340);
        apply(dark);
        syncThemeColor(dark);
      }

      window.__cmIsDark = isDarkNow;
      window.__cmToggleTheme = function () {
        var next = !isDarkNow();
        applyWithTransition(next);
        try { localStorage.setItem(KEY, next ? 'dark' : 'light'); } catch (e) {}
      };

      apply(isDarkNow());
      syncThemeColor(isDarkNow());

      // 系统主题变化时实时跟随 —— 手机（尤其 iPhone）会在夜间自动切深色，
      // 网页应当跟着变，而不是等用户手动刷新。
      // ⚠ 只在用户没手动切过时跟随：手动选过就说明有明确偏好，不该被系统覆盖。
      try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var onSystemThemeChange = function (e) {
          var saved = null;
          try { saved = localStorage.getItem(KEY); } catch (err) { }
          if (saved) return;
          applyWithTransition(e.matches);
        };
        if (mq.addEventListener) {
          mq.addEventListener('change', onSystemThemeChange);
        } else if (mq.addListener) {
          mq.addListener(onSystemThemeChange);   // 旧版 Safari（iOS 13 及更早）
        }
      } catch (e) { /* 浏览器不支持 matchMedia，忽略 */ }
    })();

    // ===== 多语言：中文站位于根目录，英文站位于 /en/ =====
    (function () {
      // 取当前文档路径（去掉 hash 前缀、查询串与尾部斜杠）：'en/currency' / 'currency' / 'en' / ''
      // ⚠ 查询串（?id=xxx，标记当前滚到哪一节）必须在这里就丢掉，不能留给调用方各自处理：
      //   它会让「英文首页 + 锚点」变成 'en?id=xxx' —— 既不等于 'en' 也不以 'en/' 开头，
      //   currentLang() 会把它误判成中文页（两侧站点的语言按钮会指错）。
      function currentPath() {
        return location.hash.replace(/^#\/?/, '').split('?')[0].replace(/\/+$/, '');
      }

      function currentLang() {
        var p = currentPath();
        // 注意 'en'（英文站首页 #/en/ 归一化后）不带斜杠，不能只判前缀
        return (p === 'en' || p.indexOf('en/') === 0) ? 'en' : 'zh';
      }

      // 语言内路径：'en/features' -> 'features'，'en' -> ''，'features' -> 'features'
      // currentPath() 已经丢掉查询串，所以切语言时不会把 ?id= 带过去 ——
      // 那正是「没做任何操作、页面自己往下滚」的根因：id 标记的是当前所在小节，
      // 而两种语言的标题 id 完全不同（「四大交易玩法」对 "Trading Systems"），
      // 带着它切回来会被 docsify 当成锚点、直接 scrollIntoView 到那一节。
      function innerPath() {
        var p = currentPath();
        return p === 'en' ? '' : p.replace(/^en\//, '');
      }

      function targetPath(lang) {
        return lang === 'en' ? 'en/' + innerPath() : innerPath();
      }

      window.__cmCurrentLang = currentLang;

      /**
       * 界面文案取词：__cmT('中文', 'English')。
       * 脚本里零散生成的界面文字（滚动提示、复制按钮、无障碍标签等）走这里，
       * 免得再出现"切了英文还写着中文"的漏网之鱼。
       * 切换语言会重建页面，所以每次用的时候现取即可，不用缓存。
       */
      window.__cmT = function (zh, en) {
        return currentLang() === 'en' ? en : zh;
      };

      // 加载层的文案也要跟着语言走。它出现得比 docsify 早得多（那时还没渲染出任何内容），
      // 所以只能靠 URL 判断语言 —— 好在 hash 里的 #/en/ 前缀一开始就存在。
      (function () {
        var el = document.getElementById('cmLoading');
        if (!el) return;
        var text = el.querySelector('.cm-loading-text');
        if (text && currentLang() === 'en') text.textContent = 'Entering the market…';
      })();

      // <html lang> 跟着当前路由走（换页可能跨语言）。
      // 影响的是无障碍朗读与搜索引擎理解，对 hash 路由来说价值有限但正确。
      window.__cmSyncLang = function () {
        document.documentElement.lang = currentLang() === 'en' ? 'en' : 'zh-CN';
      };
      // ===== 切语言时按「小节」对齐，而不是按像素 =====
      // 中英文的行高不一样（同一份 features 文档，中文 6325px、英文 6021px，差 300 多），
      // 只保持滚动像素值的话，同一个 y 在两种语言里对应的是不同小节 ——
      // 越往后错得越多，看起来就像「没做任何操作，页面自己往下滚」。
      // 解法：切换前记下视口顶部是第几节，切完再滚到新语言里同样序号的那一节。
      // ⚠ 用「第几个」而不是 id 来对应：两种语言的标题 id 完全不同
      //   （中文「四大交易玩法」对英文 "Trading Systems"）。
      var pendingHeadingIndex = -1;

      function headingEls() {
        return document.querySelectorAll('.markdown-section :where(h1, h2, h3, h4, h5, h6)[id]');
      }

      /** 当前视口顶部那一节的序号 = 最后一个越过参考线的标题；一个都没越过时返回 -1。 */
      function currentHeadingIndex() {
        var hs = headingEls(), idx = -1;
        for (var i = 0; i < hs.length; i++) {
          if (hs[i].getBoundingClientRect().top <= 90) idx = i;
          else break;   // 标题在文档里自上而下排列，越过参考线后就可以停
        }
        return idx;
      }

      function scrollToHeadingIndex(idx) {
        if (idx < 0) return;
        var el = headingEls()[idx];
        // 序号可能越界：目标页面小节更少（比如切到只有几节的首页）
        if (el) el.scrollIntoView({ block: 'start' });   // scroll-padding-top 会留出导航栏高度
      }

      /**
       * 渲染完成后调用（挂在 __cmAfterRender 里）：把视口对齐到切换前那一节的同序号位置。
       * 没有待恢复的序号时什么都不做。
       */
      window.__cmRestoreHeading = function () {
        if (pendingHeadingIndex < 0) return;
        var idx = pendingHeadingIndex;
        pendingHeadingIndex = -1;    // 先清掉：只生效一次，避免后续换页又滚一次
        // 隔一拍再滚：此刻字体/图片可能还没定型，立刻滚会滚偏
        setTimeout(function () { scrollToHeadingIndex(idx); }, 120);
      };

      window.__cmSwitchLang = function (lang) {
        if (lang === currentLang()) return;
        // 记下这次手动选择 —— head 里的自动跳转靠它判断「这个访客自己选过语言了，别再自作主张」。
        // 没有这一步，中文用户切回中文后一刷新又会被跳去英文站。
        try { localStorage.setItem('cm-lang', lang); } catch (e) { /* 隐私模式忽略 */ }
        // 记下当前所在小节，切完由 __cmRestoreHeading 对齐到新语言的同一节。
        // ⚠ 注意不是「切完回到顶部」—— 那会让从页面下方切语言的用户被强行拉回顶端
        //   （早期版本加过这个补丁，后来去掉了）。
        pendingHeadingIndex = currentHeadingIndex();
        location.hash = '#/' + targetPath(lang);
      };

      // 语言 / 主题按钮直接写在 _navbar.md 里（见那里的 class），这里只做事件委托。
      // 早先是用 JS 往 .app-nav 注入按钮，但 docsify 每次路由变化都会重建导航栏，
      // 注入的节点会被清掉 —— 连点几次就赶上一次没重新注入上，按钮就消失了。
      document.addEventListener('click', function (e) {
        var el = e.target && e.target.closest ? e.target.closest('a') : null;
        if (!el) return;

        if (el.classList.contains('lang-switch')) {
          e.preventDefault();
          window.__cmSwitchLang(currentLang() === 'en' ? 'zh' : 'en');
        } else if (el.classList.contains('theme-switch')) {
          e.preventDefault();
          window.__cmToggleTheme();
        }

        // 侧边栏的「点击收起/展开子目录」是 docsify 原生行为，这里不做干预。
      });

    })();

    // ===== 侧边栏滚动高亮（scroll spy）=====
    // docsify 的侧边栏高亮只跟路由走：点子条目跳到 #/config?id=xxx 后高亮就定在那里，
    // 滚动时不会更新 —— 长页面上会出现「都滚到最底了，左侧还停在某一节」。
    // 这里补一个滚动监听，按标题实际位置更新高亮。
    (function () {
      var OFFSET = 90;   // 参考线：视口顶部往下这么多像素。标题越过它就认为「已滚到这一节」

      // ===== 点击跳转时的高亮接力 =====
      // docsify 换页会整体重建侧边栏：新条目上没有任何 active，浏览器会渲染出
      // 「全都没高亮」的那一帧；随后它按路由给父目录加上 active，子条目则要等滚动到位
      // 才由下面的 spy 补上 —— 先亮父目录再切子条目，就是用户看到的"闪一下"。
      // 对策：点击的当下记下目标条目；侧边栏重建完（doneEach）直接把它点亮（同一帧内，
      // 不留空档），并让 spy 等滚动停下来再接管，免得中途算出过时的"当前节"又改回去。
      var jumpHref = null;
      var holdUntil = 0;

      document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('.sidebar-nav a') : null;
        if (!a) return;
        jumpHref = a.getAttribute('href');
        holdUntil = Date.now() + 4000;   // 兜底：万一滚动事件没跟上，4 秒后也放行
        // 立刻点亮。⚠ 必须在这里做，不能只等 doneEach —— 同页内跳小节（只改 ?id=）
        // 根本不会重建侧边栏，doneEach 也就不会跑，只靠那边的话高亮永远停在父目录上。
        highlightOnly(jumpHref);
      }, true);

      /**
       * 给一条侧边栏链接上/下高亮。
       * 全部走行内样式（优先级最高）而不只依赖 .active 类：docsify 内部也在按自己的时机
       * 增删那个类，只靠 class 会在某些时序下被它改回去。四样式与 CSS 里
       * `.sidebar-nav li.active > a` 那套保持一致（红字 + 左侧竖条 + 淡红底）。
       */
      function paint(a, on) {
        a.style.color = on ? 'var(--theme-color)' : '';
        a.style.fontWeight = on ? '600' : '';
        a.style.boxShadow = on ? 'inset 3px 0 0 var(--theme-color)' : '';
        a.style.background = on ? 'rgba(248, 72, 88, 0.16)' : '';
        var li = a.parentElement;
        if (li) li.classList.toggle('active', on);
      }

      /**
       * 点击跳转后的即时高亮：点亮目标小节，同时保住所属页面条目。
       * 两者都亮是原设计 —— 页面条目表示「你在这一页」，小节条目表示「你在这一节」。
       */
      function highlightOnly(href) {
        var pageHref = normHref((location.hash || '#/').split('?')[0]);
        [].forEach.call(document.querySelectorAll('.sidebar-nav a'), function (a) {
          var h = a.getAttribute('href') || '';
          var isPageLink = h.indexOf('?id=') < 0 && normHref(h) === pageHref;
          paint(a, h === href || isPageLink);
        });
      }

      function headingEls() {
        var all = [].slice.call(
          document.querySelectorAll('.markdown-section :where(h1,h2,h3,h4,h5,h6)[id]')
        );
        // 排掉不可见的标题。侧边栏折叠某个条目时，不会影响正文里的标题；但如果某节
        // 本身被隐藏（display:none），它的 getBoundingClientRect() 会返回全 0 ——
        // 0 <= OFFSET 恒成立，会被误判成「已滚到这一节」，导致高亮跳过它。
        return all.filter(function (h) {
          var r = h.getBoundingClientRect();
          return r.width > 0 || r.height > 0;
        });
      }

      // 去掉尾部斜杠再比：'#/en' 与 '#/en/' 视为同一个条目
      function normHref(h) {
        return (h || '').replace(/\/+$/, '');
      }

      function updateActive(force) {
        // 点击跳转后的滚动期间不插手：此刻算出的「当前小节」还是滚动前的位置，
        // 会把刚点亮的目标又改回去（就是那个"闪"）。等滚动停下，由 onScroll 带 force 接管。
        if (!force && jumpHref && Date.now() < holdUntil) return;
        jumpHref = null;
        holdUntil = 0;

        var hs = headingEls();

        // 找「最后一个顶部已越过参考线」的标题 = 当前所在小节
        // 取「顶部越过参考线、且离参考线最近」的那个标题。
        // 不用「最后一个满足条件的」：那个写法依赖标题的纵坐标严格递增，实测在
        // 平滑滚动过程中会取到错误的节（文档顺序与瞬时坐标对不上）。
        // 这里改成按坐标挑最接近参考线的，对顺序不敏感。
        var current = null;
        var bestTop = -Infinity;
        for (var i = 0; i < hs.length; i++) {
          var top = hs[i].getBoundingClientRect().top;
          if (top <= OFFSET && top > bestTop) {
            bestTop = top;
            current = hs[i];
          }
        }
        // 已滚到页面底部：直接取最后一个标题。
        // 页面较短时，末尾几节的顶部永远压不到参考线（实测滚到底时「参数说明」还在
        // 视口下方 157px 处），不特判的话高亮会卡在中间某节、下面几节永远轮不到。
        // 代价是滚动过程中这几节不会被逐个高亮 —— 这是短页面固有的取舍。
        if (hs.length &&
            window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) {
          current = hs[hs.length - 1];
        }

        var id = current ? current.id : null;

        // 当前页面对应的条目（href 不带 ?id=）。这一层不依赖 docsify 自己的高亮标记 ——
        // 从封面页点进来时它不一定生效（表现为「跳转后左侧没有任何条目变红」）。
        var pageHref = normHref((location.hash || '#/').split('?')[0]);

        // 先全部熄灭再上色：逐条 toggle 会出问题 —— 点击导航后 docsify 先渲染、
        // 滚动是滞后的，重算时页面可能还没滚到位，算出的「当前小节」仍是上一节，
        // 旧高亮就留在原地了（表现为两个条目同时红）。
        // 熄灭与上色都在同一帧内完成，浏览器不会渲染出中间态。
        [].forEach.call(document.querySelectorAll('.sidebar-nav a'), function (a) {
          var href = a.getAttribute('href') || '';
          var m = href.match(/[?&]id=([^&]*)/);
          var on;
          if (m) {
            // 小节条目：跟着滚动走，只高亮当前所在小节
            on = decodeURIComponent(m[1]) === id;
          } else {
            // 页面条目：只要指向当前页就常亮，不随滚动变化
            on = normHref(href) === pageHref;
          }
          paint(a, on);
        });
      }

      var ticking = false;
      var settleTimer = 0;

      function onScroll() {
        // 点击跳转后：滚动途中完全不动高亮，等停下来再强制算一次最终结果。
        // （带 force，因为 updateActive 在 holdUntil 内会拒绝执行。）
        if (jumpHref) {
          clearTimeout(settleTimer);
          settleTimer = setTimeout(function () { updateActive(true); }, 150);
          return;
        }
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () {
          ticking = false;
          updateActive();
        });
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll, { passive: true });

      // 每次渲染完成后调用（挂在 doneEach 钩子里）。
      // ⚠ 必须同步执行、不能 setTimeout：侧边栏刚重建出来的那一帧上没有任何高亮，
      //   延后一拍就会先渲染出「全灭」态 —— 视觉上正是点击后那一下闪烁。
      //   这里同步把高亮落到点击的目标上，空档期就不存在了。
      window.__cmScrollSpy = function () {
        if (jumpHref && Date.now() < holdUntil) {
          highlightOnly(jumpHref);
        } else {
          updateActive();
        }
      };
    })();

    // ===== 回到顶部按钮 =====
    // 滚动超过一屏才淡入，避免短页面上挂个没用的按钮。
    (function () {
      var btn = document.createElement('div');
      btn.id = 'cmBackTop';
      btn.textContent = '▲';
      var backTopLabel = window.__cmT ? window.__cmT('回到顶部', 'Back to top') : '回到顶部';
      btn.title = backTopLabel;
      btn.setAttribute('aria-label', backTopLabel);
      document.body.appendChild(btn);

      btn.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      function sync() {
        btn.classList.toggle('show', (window.scrollY || 0) > window.innerHeight * 0.8);
      }
      window.addEventListener('scroll', sync, { passive: true });
      window.addEventListener('resize', sync, { passive: true });
      sync();
    })();

    // ===== 正文细节：复制按钮 / 文末装饰 / 滚动入场 =====
    // 这三样都要在「每次正文渲染完之后」重新做一遍 —— docsify 换页是整块替换
    // .markdown-section 的内容，上一页插进去的节点会跟着没掉。
    (function () {
      // ---- 代码块复制按钮 ----
      // 剪贴板优先用异步 API，它只在安全上下文（https / localhost）可用；
      // 本地用 file:// 直接打开、或从局域网 IP 访问时不可用，回退到老办法。
      function copyText(text, cb) {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(
            function () { cb(true); },
            function () { cb(fallbackCopy(text)); }
          );
          return;
        }
        cb(fallbackCopy(text));
      }

      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
      }

      function addCopyButtons(section) {
        [].forEach.call(section.querySelectorAll('pre > code'), function (code) {
          var pre = code.parentElement;
          if (!pre || pre.querySelector('.cm-copy')) return;

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cm-copy';
          btn.textContent = window.__cmT ? window.__cmT('复制', 'Copy') : '复制';
          btn.setAttribute('aria-label',
            window.__cmT ? window.__cmT('复制代码', 'Copy code') : '复制代码');
          btn.addEventListener('click', function () {
            // 用 innerText 而不是 textContent：它保留代码块的换行结构，
            // 粘出去才是一段能直接跑的代码而不是挤成一坨
            copyText(code.innerText, function (ok) {
              btn.textContent = ok ? window.__cmT('已复制 ✓', 'Copied ✓')
                                   : window.__cmT('复制失败', 'Copy failed');
              btn.classList.toggle('done', ok);
              clearTimeout(btn.__cmTimer);
              btn.__cmTimer = setTimeout(function () {
                btn.textContent = window.__cmT('复制', 'Copy');
                btn.classList.remove('done');
              }, 1600);
            });
          });
          pre.appendChild(btn);
        });
      }

      // ---- 文末装饰 ----
      function addEndMark(section) {
        if (section.querySelector('.cm-end') || !section.lastElementChild) return;
        var end = document.createElement('div');
        end.className = 'cm-end';
        end.setAttribute('aria-hidden', 'true');
        end.innerHTML = '<span class="cm-end-line"></span>' +
                        '<span class="cm-end-ball"></span>' +
                        '<span class="cm-end-line"></span>';
        section.appendChild(end);
      }

      // ---- 滚动入场 ----
      // 表格 / 图片 / 代码块滚进视野时淡入上浮。
      // ⚠ 隐藏元素这件事由 body.cm-reveal-ready 这个类控制（见样式表）：
      //   只有 JS 跑到这里才会加上它。万一脚本出错没跑，元素保持默认可见，
      //   不会出现「整页空白」的事故。
      var io = null;
      var REVEAL_SEL = 'table, img, pre, blockquote, .cm-card, .cm-shot, .support-grid';

      function setupReveal(section) {
        if (!('IntersectionObserver' in window)) return;
        if (!io) {
          io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
              if (!e.isIntersecting) return;
              var el = e.target;
              el.classList.add('cm-in');
              io.unobserve(el);   // 播一次就够了，别来回抖
              // 入场播完就摘掉 cm-reveal：这个类带着自己的 transition 声明，
              // 留着会盖掉元素原有的过渡（比如卡片的 box-shadow），悬停就不跟手了。
              el.addEventListener('transitionend', function onEnd(ev) {
                if (ev.propertyName !== 'opacity' && ev.propertyName !== 'translate') return;
                el.classList.remove('cm-reveal');
                el.removeEventListener('transitionend', onEnd);
              });
            });
          }, { rootMargin: '0px 0px -6% 0px', threshold: 0.04 });
        }
        // 换页时旧节点已经不在文档里了，但要清掉观察列表里的残留引用
        io.disconnect();
        document.body.classList.add('cm-reveal-ready');

        [].forEach.call(section.querySelectorAll(REVEAL_SEL), function (el) {
          if (el.closest('.cm-end')) return;
          // 卡片里的球图标不用单独入场 —— 卡片本身已经在淡入了，
          // 图标再自己淡一次，滚进来时会看到「卡片浮上来、图标又浮一次」的叠影
          if (el.classList.contains('cm-card-icon')) return;
          // 致谢带里的球同理，而且更麻烦：带子里的条目是按档位上下排布的，
          // 处在可见范围外的那些永远等不到「进入视野」，会一直停在透明状态。
          if (el.closest('.cm-spon-box')) return;
          el.classList.add('cm-reveal');
          io.observe(el);
        });
      }

      // ---- 封面底部的滚动提示 ----
      function addScrollHint() {
        var cover = document.querySelector('.cover');
        if (!cover) return;
        var label = window.__cmT ? window.__cmT('向下滚动', 'Scroll down') : '向下滚动';

        var hint = cover.querySelector('.cm-scroll-hint');
        if (hint) {
          // 已经建过：只更新文案。
          // ⚠ 不能在这里直接 return —— 切换语言时封面不会重建（只是内容换了），
          //   提示还在，于是文案永远停在旧语言，非得刷新整页才变。
          var span = hint.querySelector('span');
          if (span && span.textContent !== label) span.textContent = label;
          return;
        }

        hint = document.createElement('div');
        hint.className = 'cm-scroll-hint';
        hint.setAttribute('aria-hidden', 'true');
        hint.innerHTML = '<span>' + label + '</span><span class="cm-hint-arrow">▼</span>';
        cover.appendChild(hint);
      }

      // ---- 把快捷键提示里的 ⌃K 改成 Ctrl K ----
      // 搜索插件把 Ctrl+K 写成了 Mac 的符号「⌃K」，Windows 用户看不懂那是什么。
      // 它是 kbd 的文本内容（不是 CSS content），只能用 JS 改。
      // 两个平台都能按：插件的 keyBindings 里 meta+k 和 ctrl+k 都绑了。
      // （搜索框在侧边栏里，每次换页都会重建，所以要跟着 __cmAfterRender 重做。）
      function fixKbdLabel() {
        var kbds = document.querySelectorAll('.search .kbd-group kbd');
        if (kbds.length < 2) return;            // [0] 是「/」，[1] 才是 Ctrl+K 那个
        var el = kbds[1];
        if (el.textContent === 'Ctrl K') return;
        el.textContent = 'Ctrl K';
        el.title = 'Press Ctrl+K to search';
      }

      // ---- 加载层退场 ----
      // 正文渲染完就不再需要它了。挂 .done 触发淡出（420ms），随后整个移出 DOM。
      // 延迟一拍再执行：封面是异步 fetch 的，立刻淡出的话会先露出正文、封面随后才"补"上来。
      function syncLoading() {
        var el = document.getElementById('cmLoading');
        if (!el || el.classList.contains('done')) return;
        el.classList.add('done');
        setTimeout(function () { el.remove(); }, 600);
      }

      /** docsify 每次渲染完正文后调用（挂在本文件的 doneEach 钩子里）。 */
      window.__cmAfterRender = function () {
        var section = document.querySelector('.markdown-section');
        if (section) {
          addCopyButtons(section);
          addEndMark(section);
          setupReveal(section);
        }
        addScrollHint();
        fixKbdLabel();
        // 换页往往伴随滚动位置变化（auto2top），进度条与视差要跟着重算一次
        if (window.__cmReadBarSync) window.__cmReadBarSync();
        // ⚠ 封面（coverpage）是「异步 fetch 一个 markdown 再渲染」的，doneEach 这一刻
        //   它很可能还没进 DOM。若此时就定态，会被判成「本页没有封面」→ 给导航栏挂上
        //   背景板、文字转深色；等封面真渲染出来（压着深色背景图）就变成了深色字压深色图，
        //   反而看不清。隔两拍补测，覆盖「慢网下封面来得更晚」的情况。
        if (window.__cmCoverParallax) {
          window.__cmCoverParallax();
          setTimeout(window.__cmCoverParallax, 150);
          setTimeout(window.__cmCoverParallax, 500);
        }
        // 加载层退场：等上面那两拍把封面也等出来，再让加载层淡出，
        // 这样看到的是「球跳 → 淡出 → 封面已在下面」，而不是先露正文、封面后补
        setTimeout(syncLoading, 200);
        // 语言相关：<html lang> 随当前路由更新（换页可能跨语言）
        if (window.__cmSyncLang) window.__cmSyncLang();
        // 致谢带的滚动（换页会重建 DOM，要重新绑定并清掉旧定时器）
        if (window.__cmSponsorStrip) window.__cmSponsorStrip();
        // 常驻元素的文案（回到顶部、进度条的无障碍标签）跟着语言走
        if (window.__cmRefreshStaticLabels) window.__cmRefreshStaticLabels();
        // 切语言后按小节对齐（中英行高不同，只保持像素位置会让内容错开一截）
        if (window.__cmRestoreHeading) window.__cmRestoreHeading();
      };
    })();

    // ===== 致谢带的纵向焦点滚动 =====
    // 每隔一拍把整体「上移一格」：每个条目的档位减 1，CSS 负责补间动画。
    // 档位环绕：超出 ±2 的条目落到对面去（列表是首尾相接的循环）。
    (function () {
      var SPEED = 2600;        // 每格停留时间（ms）—— 再快就开始抢注意力了
      var MAXPOS = 2;          // 上下各显示到第几档
      var timers = [];

      function stopAll() {     // 换页时必须清掉：否则定时器会一直累积
        timers.forEach(clearInterval);
        timers = [];
      }

      function initStrip(box) {
        var list = box.querySelector('.cm-spon-list');
        if (!list || list.dataset.cmReady) return;
        var items = [].slice.call(list.querySelectorAll('.cm-spon'));
        if (items.length < 2) return;      // 只有一个名字就没什么可滚的
        list.dataset.cmReady = '1';

        var n = items.length;
        var offset = 0;

        function apply() {
          for (var i = 0; i < n; i++) {
            // 相对「正中」的偏移，折到 -n/2 .. n/2，让上下两侧都能循环
            var pos = ((i - offset) % n + n) % n;
            if (pos > n / 2) pos -= n;
            // 超出可见档位的：设成 ±3（CSS 里那两档是透明的）
            items[i].dataset.pos =
              (pos >= -MAXPOS && pos <= MAXPOS) ? pos : (pos < 0 ? -3 : 3);
          }
        }

        apply();
        timers.push(setInterval(function () { offset++; apply(); }, SPEED));
      }

      window.__cmSponsorStrip = function () {
        stopAll();
        [].forEach.call(document.querySelectorAll('.cm-spon-box'), initStrip);
      };
    })();

    // ===== 常驻元素的文案（随语言刷新）=====
    // 「回到顶部」按钮和阅读进度条是页面加载时创建一次的、不随换页重建，
    // 所以切语言后它们的 title / aria-label 不会自己更新（用户报的"切了英文还是中文"
    // 就属于这类漏网）。换页时统一刷一遍。
    window.__cmRefreshStaticLabels = function () {
      var t = function (zh, en) { return window.__cmT ? window.__cmT(zh, en) : zh; };
      var back = document.getElementById('cmBackTop');
      if (back) {
        var label = t('回到顶部', 'Back to top');
        back.title = label;
        back.setAttribute('aria-label', label);
      }
      var bar = document.getElementById('cmReadBar');
      if (bar) bar.setAttribute('aria-label', t('阅读进度', 'Reading progress'));
    };

    // ===== 补一条「/」快捷键 =====
    // docsify 判断快捷键用的是 e.key === '/'，但中文输入法在标点模式下按 / 出来的是「、」，
    // e.key 变成 '、'，它的三个判断条件（e.key / e.code==='/' / e.code==='key/'）就全落空了
    // —— 中文玩家按 / 打不开搜索框，只能用 Ctrl+K（字母键的 e.key 不受标点模式影响）。
    // 这里按 e.code（物理键位 'Slash'）补一条，与输入法和中英文状态都无关。
    (function () {
      document.addEventListener('keydown', function (e) {
        if (e.code !== 'Slash') return;
        // Shift+/ 打的是「?」，不是想搜索；带 Ctrl/Alt/Cmd 的组合交给浏览器
        if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
        // 已经在输入框里打字时不抢
        var ae = document.activeElement;
        if (ae && ae.matches && ae.matches('input, select, textarea')) return;
        var input = document.querySelector('.search input');
        if (!input) return;
        e.preventDefault();
        input.focus();
      });
    })();

    // ===== 阅读进度条 =====
    // 注意与 docsify 自带的 body > .progress 区分：那条是「页面加载进度」，
    // 加载完就归零淡出；这条是「正文阅读进度」，跟着滚动走。
    (function () {
      var bar = document.createElement('div');
      bar.id = 'cmReadBar';
      bar.setAttribute('role', 'progressbar');
      bar.setAttribute('aria-label',
        window.__cmT ? window.__cmT('阅读进度', 'Reading progress') : '阅读进度');
      document.body.appendChild(bar);

      function sync() {
        var doc = document.documentElement;
        var y = window.scrollY || 0;

        // ⚠ 页面高度取几个来源的最大值，不能只看 documentElement.scrollHeight：
        //   手机上地址栏收放会让 window.innerHeight 变化，两个数一错位，
        //   算出的「可滚动距离」就偏小 —— 表现为进度条提前满格、但页面还能继续滑
        //   （用户报的正是这个：进度条满了，浏览器滚动条却还没到底）。
        var pageH = Math.max(
          doc.scrollHeight,
          doc.offsetHeight,
          document.body ? document.body.scrollHeight : 0
        );
        var viewH = doc.clientHeight || window.innerHeight || 1;
        var max = pageH - viewH;
        var pct = max > 0 ? Math.min(100, Math.max(0, (y / max) * 100)) : 0;

        // 已经到底就直接画满 —— 比靠百分比算更可靠，保证「到底 = 满格」这件事一定成立
        var atBottom = y + viewH >= pageH - 2;
        bar.style.width = (atBottom ? 100 : pct) + '%';

        // 页面还在顶部时让位给加载进度条（两者都贴顶边，同时亮会打架）
        bar.classList.toggle('show', y > 60);
      }

      window.addEventListener('scroll', sync, { passive: true });
      window.addEventListener('resize', sync, { passive: true });
      window.__cmReadBarSync = sync;
      sync();
    })();

    // ===== 封面视差 + 导航栏背景板 =====
    // 背景层比封面大 6%（见样式表的 inset: -6%），可移动余量约 ±100px，这里限到 ±90。
    // 只在小屏以上做：手机上滚动地址栏伸缩会频繁触发重算，而且屏幕太小、视差看不出来。
    (function () {
      var MAX = 90;

      function sync() {
        var cover = document.querySelector('.cover');
        var y = window.scrollY || 0;

        // 导航栏的两态，两个互斥的正向类（CSS 里只按正向匹配，不写否定式）：
        //   cm-on-cover   封面还在视野里 → 导航栏全透明 + 白字
        //   cm-past-cover 已滚过封面（或本页没有封面）→ 浮出背景板 + 主题字色
        // 判据用「封面底边是否还在视口里」，而不是 y 与 cover.offsetHeight 比大小 ——
        // 后者在实测中与肉眼所见对不上（封面是 flex 容器、还有一层放大的背景伪元素）。
        var onCover = !!cover && cover.getBoundingClientRect().bottom > 80;
        document.body.classList.toggle('cm-on-cover', onCover);
        document.body.classList.toggle('cm-past-cover', !onCover);

        // 视差只在小屏以上做：手机上滚动地址栏伸缩会频繁触发重算，而且屏幕小看不出来
        if (!cover || window.innerWidth <= 640) return;
        var shift = Math.max(-MAX, Math.min(MAX, y * 0.28));
        cover.style.setProperty('--cm-parallax', shift.toFixed(1) + 'px');
      }

      window.addEventListener('scroll', sync, { passive: true });
      window.addEventListener('resize', sync, { passive: true });
      window.__cmCoverParallax = sync;
      sync();   // 首屏也要定一次态：非首页要立刻带背景，不能等第一次滚动
    })();

    window.$docsify = {
      name: 'CobbleMarket',
      repo: 'https://github.com/ShuShengA/cobblemarket',

      // 点击导航 / 侧边栏跳转后自动回到页面顶部（docsify 默认 false，不设就会停在上一页的滚动位置）
      auto2top: true,

      // 侧边栏和导航栏（按语言目录自动匹配：/en/ 下用 en/_sidebar.md）
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      mergeNavbar: true,

      // 封面页：必须用「对象形式」逐条列出路由。
      // 配成 true 时 docsify 会把它转成字符串 '_coverpage.md'，而字符串模式只在
      // routePath === '/' 时生效（见 fetch/index.js 的 _fetchCover）—— 英文站首页 #/en/
      // 永远拿不到封面，切语言就直接落在内容区。
      // ⚠ 值相对于「当前路由所在目录」（docsify 内部会做 root + path），
      //    所以两边都写文件名本身，别写成 en/_coverpage.md（会拼成 /en/en/_coverpage.md）。
      coverpage: {
        '/': '_coverpage.md',
        '/en/': '_coverpage.md'
      },

      // 404 页：按路径前缀匹配（key 长度降序，所以 /en/ 优先于 /）
      notFoundPage: {
        '/en/': 'en/_404.md',
        '/': '_404.md'
      },

      // 搜索
      search: {
        paths: 'auto',
        placeholder: {
          '/': '搜索文档',
          '/en/': 'Search docs'
        },
        noData: '未找到相关文档 / No results'
      },

      // 每次渲染完成后刷新导航栏按钮（语言按钮文案/链接依赖当前路径）
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            window.__cmScrollSpy();
            // 复制按钮 / 文末装饰 / 滚动入场 —— 换页会整块替换正文，每次都得重做
            if (window.__cmAfterRender) window.__cmAfterRender();
          });
        }
      ]
    };

    // ⚠⚠ 上面那两个字符 `};` 绝对不能省、也不能只写 `;`！
    //   ① 把 `}` 漏掉 → 对象字面量没闭合 → 整个 <script> 块语法错误 →
    //      window.$docsify 根本没被赋值 → 封面/深色主题/导航/插件全部失效。
    //   ② 只写 `}` 不写 `;` → ASI 不生效（后面紧跟 IIFE），
    //      被解析成「把配置对象当函数调用」→ 运行时 TypeError → 同样全废。
    //   ⚠ 前面已经有过一条同样的教训（见上方 1597 行附近），别再踩。
    //   window.$docsify 的闭合 } 后面若直接跟 IIFE（写成 `}\n(function () {...})()`），
    //   ASI 不生效，会被解析成「把配置对象当函数调用」→ 运行时 TypeError →
    //   window.$docsify 整个赋值失败 → 首页/封面/导航/插件等全部自定义配置失效，
    //   页面停在加载态（精灵球那个画面）。语法检查查不出来（语法本身合法），极难定位。

    // ===== 临时诊断面板（只认 ?diag=1，平时零影响；排查完可整段删）=====
    // 拿来确认微信内置浏览器里「认不认 svh、vh 会不会随底栏收放变化」。
    // 判据：100svh 显示「不支持」= 落回了 vh；100vh / cover 的 [最小~最大] 区间不为零 = 高度在变。
    (function () {
      if (!/[?&]diag=1/.test(location.search)) return;

      function probe(h) {
        var el = document.createElement('div');
        el.style.cssText = 'position:absolute;top:0;left:0;width:0;pointer-events:none;visibility:hidden;height:' + h;
        document.body.appendChild(el);
        return el;
      }
      var elVh = probe('100vh');
      var elSvh = probe('100svh');

      var panel = document.createElement('div');
      panel.style.cssText = 'position:fixed;top:0;left:0;z-index:2147483647;' +
        'background:rgba(0,0,0,.85);color:#0f0;font:11px/1.6 monospace;' +
        'padding:6px 9px;white-space:pre;pointer-events:none;';
      document.body.appendChild(panel);

      var r = { ih: [], vh: [], svh: [], cover: [] };
      function track(arr, v) {
        if (!arr.length) { arr[0] = arr[1] = v; return; }
        if (v < arr[0]) arr[0] = v;
        if (v > arr[1]) arr[1] = v;
      }
      function line(label, arr) {
        return label + ' ' + arr[1] + ' [' + arr[0] + '~' + arr[1] + ']';
      }
      function upd() {
        var cover = document.querySelector('.cover');
        var svh = elSvh.offsetHeight;
        var cmvh = getComputedStyle(document.documentElement)
          .getPropertyValue('--cm-vh').trim();
        track(r.ih, window.innerHeight);
        track(r.vh, elVh.offsetHeight);
        track(r.svh, svh);
        track(r.cover, cover ? cover.offsetHeight : -1);
        panel.textContent =
          line('innerH', r.ih) + '\n' +
          line('100vh ', r.vh) + '\n' +
          '100svh ' + (svh === 0 ? '不支持 → 落回 vh' : r.svh[1] + ' [' + r.svh[0] + '~' + r.svh[1] + ']') + '\n' +
          line('cover ', r.cover) + '\n' +
          '--cm-vh ' + (cmvh || '(未设)') + '\n' +
          'w' + window.innerWidth + ' dpr' + window.devicePixelRatio;
      }
      upd();
      setInterval(upd, 250);
    })();
  </script>

  <!-- Docsify 核心 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
  <!-- 搜索插件：必须用 dist/ 下的那份。
       lib/plugins/search.min.js 是 v4 时代的 API（调用了 v5 已移除的
       Docsify.dom.toggleClass / before），加载后在 doneEach 钩子里抛未捕获异常，
       把排在它后面的插件钩子（含本页的滚动高亮 __cmScrollSpy）全部带崩 ——
       表现为「文件是最新的、逻辑也对，但功能就是不生效」。 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
</body>
</html>
